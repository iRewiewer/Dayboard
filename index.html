<!doctype html>
<html lang="en" data-mode="dark" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <meta name="description" content="A task board with configurable daily tasks and repeat schedules." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dayboard</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('dayboard-theme') || 'null');
        if (theme && (theme.mode === 'light' || theme.mode === 'dark') && typeof theme.color === 'string') {
          document.documentElement.dataset.mode = theme.mode;
          document.documentElement.dataset.accent = theme.color;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
