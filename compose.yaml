services:
  dayboard:
    build: .
    ports:
      - "127.0.0.1:${DAYBOARD_PORT:-9192}:${PORT:-9192}"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-9192}"
      DATA_DIR: /app/data
      TZ: "${TZ:-UTC}"
    volumes:
      - dayboard-data:/app/data
    restart: unless-stopped

volumes:
  dayboard-data:
